
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DATE AND TIME</title>
</head>
<body>

    <div class="container">THis is our Webpage</div>
   

    <script>
        // 📅 Getting the current date & time right now (LIVE snapshot)
        let now = new Date();
        console.log(now); // 🖥 Shows current date-time in console

        // 💡 This creates a date from milliseconds since Jan 1, 1970 (Unix epoch)
        let dt = new Date(100000); 
        console.log(dt); // 😮 This is like "100000 ms after 1970", so ~Jan 1, 1970, 5:30 AM IST

        // 🛠 Ways to create a date:
        // new Date(year, month, date, hours, minutes, seconds, ms)
        // Reminder: month is 0-based → 0 = Jan, 9 = Oct
        // let newdate= new Date("2024-10-29"); // You can also pass as a string
        let newdate = new Date(2024, 9, 29, 2, 3, 4); // 🎯 Oct 29, 2024 at 2:03:04 AM
        console.log(newdate);

        // ✍ Updating individual date parts (setters)
        newdate.setFullYear(2025);   // Change year → 2025 🎉
        newdate.setDate(15);         // Change day of month → 15th
        newdate.setMonth(0);         // Month = Jan (remember: 0-based!)
        newdate.setHours(12);        // Set hour → 12 PM
        newdate.setMinutes(23);      // Minute → 23
        newdate.setSeconds(27);      // Seconds → 27

        // 📤 Getting (reading) individual date parts (getters)
        let curYear = newdate.getFullYear();
        console.log("The required year is " + curYear); // Prints: 2025
       
        let curDate = newdate.getDate();
        console.log("req date is " + curDate); // Day of month
       
        let curMonth = newdate.getMonth();
        console.log(curMonth); // Shows month index (0 = Jan)

        let curHour = newdate.getHours();
        console.log(curHour); // Hours in 24-hour format

        let curMin = newdate.getMinutes();
        console.log(curMin); // Minutes
       
        let curSeconds = newdate.getSeconds();
        console.log(curSeconds); // Seconds
    </script>
</body>
</html>
