
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATH OBJECT</title>
</head>
<body>

    <script>
        // 📦 Math object in JS → contains constants & functions for math stuff
        let mathObject = Math;
        console.log(mathObject); // Shows everything Math can do

        // 🔢 Some important math constants
        console.log("The value of Math.E is", Math.E);         // Euler's number (~2.718)
        console.log("Math.PI : ", Math.PI);                    // π (~3.14159)
        console.log("LN2 : ", Math.LN2);                       // Natural log of 2 (~0.693)
        console.log("SQRT1_2", Math.SQRT1_2);                  // Square root of 1/2 (~0.707)

        // 🎯 Example numbers
        let a = 23.9386876;
        let b = 67;

        console.log("the value of a and b is", a, b);

        // 🌀 Rounding numbers
        console.log("The round off of a and b is", Math.round(a), Math.round(b)); 
        // Math.round → nearest integer

        // ⚡ Power and square root
        console.log("4 raised to the power of 2 is", Math.pow(4, 2)); // 4² = 16
        console.log("square root of 81", Math.sqrt(81)); // √81 = 9

        // ⬆⬇ ceil & floor
        console.log("5.8 rounded up to nearest integer is", Math.ceil(5.8)); // → 6
        console.log("5.8 rounded down to nearest integer is", Math.floor(5.8)); // → 5

        // 📏 Absolute value (removes sign)
        console.log("the absolute of -6487 is", Math.abs(-6487)); // → 6487
        console.log("the absolute of 6487 is", Math.abs(6487));   // → 6487

        // 📐 Trigonometric functions
        console.log("The value of sin(pi/2) is", Math.sin(Math.PI / 2)); // → 1
        console.log("The value of cos(pi/2) is", Math.cos(Math.PI / 2)); // → ~0
        console.log("The value of tan(pi/2) is", Math.tan(Math.PI / 2)); // → Infinity 🤯

        // 🔽🔼 Min & Max
        console.log("Minimum of 12,32,8,1,83 is", Math.min(12, 32, 8, 1, 83)); // → 1
        console.log("Maximum of 12,302,8,1,83 is", Math.max(12, 302, 8, 1, 83)); // → 302

        // 🎲 Random number (0 to 1)
        console.log("The random number is", Math.random()); 

        // 🎯 Random number in range [1, 100]
        let minNum = 1;
        let maxNum = 100;
        let r1_100 = minNum + (maxNum - minNum) * Math.random(); // Formula: min + range * random
        console.log(r1_100); // Can be decimal between 1 and 100
    </script>
   
</body>
</html>
